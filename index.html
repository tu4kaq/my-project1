<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вопрос для тебя ❤️</title>
    <style>
        /* Общие стили и фон */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0); /* Нежно-розовый градиент */
        }

        /* Контейнер для всей анимации */
        .container {
            perspective: 1000px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        /* Стиль открытки */
        .card {
            position: relative;
            width: 100%;
            height: 450px;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        /* Состояние, когда открытка "открыта" */
        .card.open {
            transform: rotateY(180deg);
        }

        /* Лицевая и внутренняя стороны */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Лицевая сторона (с вопросом) */
        .card-front {
            background: white;
            z-index: 2;
        }

        /* Внутренняя сторона (с текстом "Ты победил") */
        .card-back {
            background: #fff0f3;
            transform: rotateY(180deg);
            color: #ff4d6d;
        }

        h1 {
            font-size: 24px;
            color: #ff4d6d;
            margin-bottom: 30px;
        }

        /* Поле ввода */
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #ffafbd;
            border-radius: 25px;
            outline: none;
            font-size: 16px; /* Чтобы iOS не зумил при вводе */
            text-align: center;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #ff4d6d;
        }

        /* Текст внутри открытки */
        .win-text {
            font-size: 32px;
            font-weight: bold;
            animation: heartBeat 1.5s infinite;
        }

        /* Анимация бьющегося сердца */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        /* Анимация летающих сердечек */
        .heart-particle {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 3s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-500px) rotate(360deg); opacity: 0; }
        }

        /* Кнопка для мобильных, чтобы было удобнее нажимать Enter */
        .btn-submit {
            margin-top: 20px;
            padding: 10px 25px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="card">
            <!-- Лицевая сторона -->
            <div class="card-face card-front">
                <h1>пиво или сидр?</h1>
                <input type="text" id="answerInput" placeholder="Твой ответ..." autocomplete="off">
                <button class="btn-submit" onclick="checkAnswer()">Ответить ❤️</button>
            </div>

            <!-- Внутренняя сторона -->
            <div class="card-face card-back">
                <div class="win-text">ты победил</div>
                <div style="font-size: 50px; margin-top: 20px;">🏆</div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const input = document.getElementById('answerInput');

        // Функция проверки ответа
        function checkAnswer() {
            const userAnswer = input.value.toLowerCase().trim();

            if (userAnswer === 'пиво') {
                openCard();
            } else {
                // Если ответ неверный, можно добавить легкую тряску (опционально)
                input.style.borderColor = 'red';
                setTimeout(() => input.style.borderColor = '#ffafbd', 500);
            }
        }

        // Позволяет нажимать Enter на клавиатуре
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function openCard() {
            // 1. Запускаем анимацию сердечек
            createHearts();

            // 2. Переворачиваем открытку
            card.classList.add('open');

            // 3. Убираем фокус с инпута, чтобы клавиатура закрылась (на мобилках)
            input.blur();
        }

        // Функция создания летающих сердечек
        function createHearts() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '80vh';
                    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    document.body.appendChild(heart);

                    // Удаляем сердечко после анимации
                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
